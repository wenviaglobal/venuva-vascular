server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + admin-uploaded images → the API container.
    location /api/ {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
    location /uploads/ {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
    }

    # Long-cache immutable static assets (hashed by Vite).
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA + prerendered pages. Strip trailing slash to match sitemap/canonical URLs,
    # then serve the prerendered /path/index.html at /path (200, no redirect).
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri/index.html $uri /index.html;
    }
}
